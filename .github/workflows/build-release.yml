name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'server/**'
      - '.github/workflows/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:


  docker:
    name: Build Server Container
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          git fetch --tags origin || true
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
            echo "IMAGE_VERSION=${LATEST_TAG#v}" >> $GITHUB_ENV
          fi
      - name: Show version number
        run: echo "Building release for version - $IMAGE_VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare tags
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/dev" ]; then
            echo "DOCKER_TAGS=raidolo/ha-alexa-shopping-list-sync:dev" >> $GITHUB_ENV
          else
            echo "DOCKER_TAGS=raidolo/ha-alexa-shopping-list-sync:${{ env.IMAGE_VERSION }},raidolo/ha-alexa-shopping-list-sync:latest" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./server/
          push: true
          provenance: false
          tags: ${{ env.DOCKER_TAGS }}
  

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref != 'refs/heads/dev'
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          git fetch --tags origin || true
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
            echo "IMAGE_VERSION=${LATEST_TAG#v}" >> $GITHUB_ENV
          fi

      - name: Extract changelog
        run: |
          BODY=$(python -c "
          import sys, re
          with open('CHANGELOG.md', 'r') as f:
              lines = f.readlines()
          start, end = -1, -1
          for i, line in enumerate(lines):
              if re.match(r'^## \[[0-9]', line):
                  if start == -1: start = i + 1
                  elif end == -1: end = i; break
          if start != -1 and end != -1:
              print(''.join(lines[start:end]).strip())
          elif start != -1:
              print(''.join(lines[start:]).strip())
          ")
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create a Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.IMAGE_VERSION }}
          release_name: v${{ env.IMAGE_VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
  

  hass:
    name: Publish update to HASS Add-on repository
    runs-on: ubuntu-latest
    needs: release
    if: github.ref != 'refs/heads/dev'
    env:
      REPO_NAME: raidolo/home-assistant-alexa-shopping-list-hass
      FILE_PATH: alexa_shopping_list/config.yaml
    steps:
      - name: Check out main repository
        uses: actions/checkout@v3
        with:
          path: main-repo
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          cd main-repo
          git fetch --tags origin || true
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
            echo "IMAGE_VERSION=${LATEST_TAG#v}" >> $GITHUB_ENV
          fi
          cd ..

      - name: Check out the external repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.REPO_NAME }}
          path: external-repo
          token: ${{ secrets.HASS_REPO_TOKEN }}

      - name: Update version and copy CHANGELOG
        run: |
          cd external-repo
          sed -i "s/^version:.*/version: '${{ env.IMAGE_VERSION }}'/" ${{ env.FILE_PATH }}
          cp ../main-repo/CHANGELOG.md alexa_shopping_list/CHANGELOG.md
          cd ../

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.HASS_REPO_TOKEN }}
        run: |
          cd external-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.FILE_PATH }} alexa_shopping_list/CHANGELOG.md
          git commit -m "Update version to ${{ env.IMAGE_VERSION }} and sync CHANGELOG" || true
          git push origin main || true
